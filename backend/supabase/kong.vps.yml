_format_version: "2.1"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - apikey
        - x-client-info
        - x-user-id
      exposed_headers:
        - X-Auth-Token
      max_age: 3600

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1

  - name: realtime-v1
    url: http://realtime:4000
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1

  - name: functions-v1
    url: http://functions:9000
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1
